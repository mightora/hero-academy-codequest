<!doctype html><html><head><meta charset="utf-8">
<!-- No origin, cookies, storage, frames, forms, external scripts, or external connections. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'; base-uri 'none'; form-action 'none'">
</head><body><script>
(()=>{
 let port=null,worker=null,booted=false;
 addEventListener('message',event=>{
  if(booted||event.source!==parent||event.data?.type!=='quest-connect'||!event.ports[0])return;
  booted=true;port=event.ports[0];port.start();
  port.onmessage=e=>{
   const m=e.data;
   if(m?.type==='boot'){
    try{
     // Engine modules are already bundled into the classic worker. These names
     // resolve only to its in-memory module registry, never to a network import.
     const assetURLs=Object.fromEntries(Object.keys(m.assets).map(name=>[name,'https://codequest.invalid/'+name]));
     const url=URL.createObjectURL(new Blob([m.workerSource],{type:'text/javascript'}));
     // A module worker cannot fetch its bootstrap from an opaque origin in
     // Chromium. A classic bundle also avoids opaque-origin dynamic imports.
     worker=new Worker(url,{type:'classic',name:'CodeQuest isolated runtime'});
     worker.onmessage=e=>port.postMessage(e.data);
     worker.onerror=e=>port.postMessage({type:'error',error:e.message||'The language could not start on this browser.'});
     worker.postMessage({type:'boot',language:m.language,assets:m.assets,assetURLs});
    }catch(error){port.postMessage({type:'error',error:String(error.message||error)});}
   }else if(m?.type==='run')worker?.postMessage(m);
   else if(m?.type==='stop'){worker?.terminate();worker=null;port.postMessage({type:'stopped'});}
  };
  port.postMessage({type:'connected'});
 });
})();
</script></body></html>
